[project]
name = "structured-data-extractor"
version = "0.1.0"
description = "Extract invoice data from messy PDF and HTML files into validated Pydantic v2 models"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.162.0",
    "instructor>=1.17.0",
    "json-repair>=0.64.2",
    "openai>=3.3.0",
    "pydantic>=2.14.1",
    "pypdf>=6.21.3",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "python-dotenv>=1.2.4",
    "streamlit>=1.66.1",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
