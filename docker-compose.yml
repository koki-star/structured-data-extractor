services:
  app:
    build: .
    ports:
      - "8501:8501"
    environment:
      # Ollama runs on your Mac, not in the container
      OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
    extra_hosts:
      # Needed on Linux. Docker Desktop for Mac already knows this name.
      - "host.docker.internal:host-gateway"
    volumes:
      # Keep failed extractions on your computer
      - ./dlq:/app/dlq
